[project]
name = "sww"
version = "0.1.0"
description = "Slimming While Winning: webcam body tracking mapped to keyboard input for games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pose/hand landmark models (Tasks API). Pulls in numpy and
    # opencv-contrib-python itself.
    "mediapipe>=1.2.0",
    # Declared explicitly because we import cv2 directly. Must be the
    # *contrib* build: mediapipe depends on it, and installing plain
    # opencv-python alongside it gives two conflicting cv2 packages.
    "opencv-contrib-python>=4.10",
    "numpy>=2.0",
]

[project.scripts]
sww = "sww.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sww"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
